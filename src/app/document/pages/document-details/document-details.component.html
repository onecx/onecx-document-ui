<ocx-portal-page
  permission="DOCUMENT#VIEW"
  [helpArticleId]="'DOCUMENT_DETAILS.HELP_ARTICLE_ID' | translate"
  *ngrxLet="viewModel$; let vm"
>
  <ocx-loading-indicator *ngIf="vm.detailsLoadingIndicator"> </ocx-loading-indicator>
  <ocx-error *ngIf="!vm.detailsLoaded && !vm.detailsLoadingIndicator"> </ocx-error>
  <div *ngIf="vm.detailsLoaded && !vm.detailsLoadingIndicator" class="flex flex-column">
    <ocx-page-header
      [header]="'DOCUMENT_DETAILS.HEADER' | translate"
      [subheader]="'DOCUMENT_DETAILS.SUB_HEADER' | translate"
      [actions]="(headerActions$ | async) ?? []"
      [disableDefaultActions]="true"
      [manualBreadcrumbs]="true"
      [ariaLabel]="'DOCUMENT_DETAILS.FORM.NAME' | translate"
    >
    </ocx-page-header>
    <ocx-content-container layout="vertical">
      <ocx-content class="w-full" role="main" [ariaLabel]="'DOCUMENT_DETAILS.ARIA-LABEL' | translate">
        <div class="surface-section mb-1 mx-3">
          <app-document-details-form [formGroup]="formGroup" [availableTypes]="(documentTypes$ | async) || []">
          </app-document-details-form>
        </div>
      </ocx-content>
      <ocx-content class="w-full">
        <div class="card p-4">
          <p-tabs value="0">
            <p-tablist>
              <p-tab value="0">{{ 'DOCUMENT_DETAILS.SECTIONS.ATTACHMENTS' | translate }}</p-tab>
              <p-tab value="1">{{ 'DOCUMENT_DETAILS.SECTIONS.CHARACTERISTICS' | translate }}</p-tab>
            </p-tablist>
            <p-tabpanels>
              <p-tabpanel value="0">
                <app-document-details-attachment-list
                  [attachments]="attachmentsFormArray"
                  [editMode]="vm.editMode"
                  (download)="onAttachmentDownload($event)"
                  (retryUpload)="onFileUploadRetry($event)"
                >
                </app-document-details-attachment-list>
              </p-tabpanel>
              <p-tabpanel value="1">
                <app-document-details-characteristics
                  [characteristics]="characteristicsFormArray"
                  [editMode]="vm.editMode"
                  (characteristicRemoved)="onCharacteristicRemove($event)"
                  (characteristicAdded)="onCharacteristicAdd()"
                >
                </app-document-details-characteristics>
              </p-tabpanel>
            </p-tabpanels>
          </p-tabs>
        </div>
      </ocx-content>
    </ocx-content-container>
  </div>
</ocx-portal-page>
