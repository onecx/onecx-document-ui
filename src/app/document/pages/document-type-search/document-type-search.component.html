<ocx-portal-page
  permission="DOCUMENT#SEARCH"
  [helpArticleId]="'DOCUMENT_TYPE_SEARCH.HELP_ARTICLE_ID' | translate"
  *ngrxLet="viewModel$; let vm"
>
  @if (vm.loadingIndicator) {
    <ocx-loading-indicator></ocx-loading-indicator>
  }
  <ocx-search-header
    [header]="'DOCUMENT_TYPE_SEARCH.HEADER' | translate"
    [subheader]="'DOCUMENT_TYPE_SEARCH.SUB_HEADER' | translate"
    [resetButtonAriaLabel]="'DOCUMENT_SEARCH.HEADER_ACTIONS.RESET_BUTTON.ARIA_LABEL' | translate"
    [resetButtonTooltip]="'DOCUMENT_SEARCH.HEADER_ACTIONS.RESET_BUTTON.TOOLTIP' | translate"
    [manualBreadcrumbs]="true"
    [actions]="(headerActions$ | async) ?? []"
    (componentStateChanged)="searchHeaderComponentStateChanged($event)"
    (searched)="search(searchForm)"
    (resetted)="resetSearch()"
    [viewMode]="vm.searchHeaderComponentState?.activeViewMode ?? 'basic'"
    [ariaLabel]="'DOCUMENT_TYPE_SEARCH.ARIA-LABEL' | translate"
  >
    <form [formGroup]="searchForm" class="w-full">
      <p-floatlabel variant="on">
        <input
          id="dm_document_type_search_name"
          type="text"
          pInputText
          class="w-full"
          formControlName="name"
          [ariaLabel]="'DOCUMENT_TYPE_SEARCH.SEARCH_NAME' | translate"
        />
        <label for="dm_document_type_search_name">
          {{ 'DOCUMENT_TYPE_SEARCH.SEARCH_NAME' | translate }}
        </label>
      </p-floatlabel>
    </form>
  </ocx-search-header>
  <ocx-content-container layout="horizontal">
    <ocx-content class="w-full">
      <ocx-interactive-data-view
        (viewItem)="editItem($event)"
        (deleteItem)="deleteItem($event)"
        viewPermission="DOCUMENT#EDIT"
        deletePermission="DOCUMENT#DELETE"
        [data]="vm.results"
        [columns]="vm.columns"
        [displayedColumnKeys]="displayedColumnKeys"
        [emptyResultsMessage]="'DOCUMENT_TYPE_SEARCH.EMPTY_RESULTS' | translate"
        (componentStateChanged)="resultComponentStateChanged($event)"
        [layout]="vm.resultComponentState?.layout ?? 'table'"
        [supportedViewLayouts]="['list', 'table']"
        [page]="vm.resultComponentState?.activePage ?? 0"
        [pageSize]="vm.resultComponentState?.pageSize"
        [filters]="vm.resultComponentState?.filters ?? []"
        [sortField]="vm.resultComponentState?.sorting?.sortColumn"
        [sortDirection]="vm.resultComponentState?.sorting?.sortDirection ?? defaultDataSortDirection"
        [selectedRows]="vm.resultComponentState?.selectedRows ?? []"
        [defaultGroupKey]="vm.resultComponentState?.activeColumnGroupKey ?? ''"
        [actionColumnPosition]="vm.resultComponentState?.actionColumnConfig?.position ?? 'left'"
        [frozenActionColumn]="vm.resultComponentState?.actionColumnConfig?.frozen ?? false"
        [ariaLabel]="'DOCUMENT_TYPE_SEARCH.RESULTS.NAME' | translate"
      >
      </ocx-interactive-data-view>
    </ocx-content>
  </ocx-content-container>

  <p-dialog
    [header]="
      vm.editingDocumentType
        ? ('DOCUMENT_TYPE_SEARCH.DIALOG.EDIT_HEADER' | translate)
        : ('DOCUMENT_TYPE_SEARCH.DIALOG.CREATE_HEADER' | translate)
    "
    [visible]="vm.dialogVisible"
    [modal]="true"
    [style]="{ width: '400px' }"
    [draggable]="false"
    [resizable]="false"
    (visibleChange)="!$event && closeDialog()"
    (onShow)="onDialogShow(vm.editingDocumentType)"
  >
    <form [formGroup]="documentTypeFormGroup" class="flex flex-column gap-3 pt-1">
      <p-floatlabel variant="on">
        <input
          id="dm_document_type_search_documentTypeName"
          type="text"
          pInputText
          class="w-full"
          formControlName="name"
          [ariaLabel]="'DOCUMENT_TYPE_SEARCH.DIALOG.NAME_LABEL' | translate"
        />
        <label for="dm_document_type_search_documentTypeName">
          {{ 'DOCUMENT_TYPE_SEARCH.DIALOG.NAME_LABEL' | translate }}
        </label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <textarea
          id="dm_document_type_search_documentTypeDescription"
          pInputTextarea
          class="w-full"
          formControlName="description"
          [ariaLabel]="'DOCUMENT_TYPE_SEARCH.DIALOG.DESCRIPTION_LABEL' | translate"
        ></textarea>
        <label for="dm_document_type_search_documentTypeDescription">
          {{ 'DOCUMENT_TYPE_SEARCH.DIALOG.DESCRIPTION_LABEL' | translate }}
        </label>
      </p-floatlabel>
      <div class="flex align-items-center gap-2">
        <p-checkbox
          id="dm_document_type_search_documentTypeActiveStatus"
          formControlName="activeStatus"
          [binary]="true"
        ></p-checkbox>
        <label for="dm_document_type_search_documentTypeActiveStatus">
          {{ 'DOCUMENT_TYPE_SEARCH.DIALOG.ACTIVE_STATUS_LABEL' | translate }}
        </label>
      </div>
    </form>
    <ng-template pTemplate="footer">
      <button pButton type="button" (click)="closeDialog()">
        {{ 'GENERAL.CANCEL' | translate }}
      </button>
      <button pButton type="button" [disabled]="isFormInvalid()" (click)="saveDocumentType(vm.editingDocumentType)">
        {{ 'GENERAL.CREATE' | translate }}
      </button>
    </ng-template>
  </p-dialog>
</ocx-portal-page>
